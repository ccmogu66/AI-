<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 能力全景工程图</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #f8f7f4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  h1 {
    font-size: 18px;
    font-weight: 500;
    color: #2c2c2a;
    margin-bottom: 24px;
    letter-spacing: 0.01em;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    padding: 32px;
    max-width: 760px;
    width: 100%;
  }
  svg text { font-family: inherit; }

  /* color ramps - light mode */
  .c-purple rect, .c-purple circle, .c-purple ellipse { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th { fill: #3C3489; }
  .c-purple .ts { fill: #534AB7; }

  .c-teal rect, .c-teal circle, .c-teal ellipse { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th { fill: #085041; }
  .c-teal .ts { fill: #0F6E56; }

  .c-amber rect, .c-amber circle, .c-amber ellipse { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber .th { fill: #633806; }
  .c-amber .ts { fill: #854F0B; }

  .c-coral rect, .c-coral circle, .c-coral ellipse { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th { fill: #712B13; }
  .c-coral .ts { fill: #993C1D; }

  .c-blue rect, .c-blue circle, .c-blue ellipse { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue .th { fill: #0C447C; }
  .c-blue .ts { fill: #185FA5; }

  .node { cursor: pointer; }
  .node:hover rect, .node:hover circle { opacity: 0.85; }

  .arr { stroke: #b4b2a9; fill: none; stroke-width: 0.5; }
  .leader { stroke: #b4b2a9; fill: none; stroke-width: 0.5; stroke-dasharray: 4 3; }

  .th { font-size: 14px; font-weight: 500; fill: #2c2c2a; }
  .ts { font-size: 12px; font-weight: 400; fill: #5f5e5a; }

  /* tooltip */
  #tooltip {
    position: fixed;
    background: #2c2c2a;
    color: #f1efe8;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 200px;
    z-index: 100;
  }

  footer {
    margin-top: 16px;
    font-size: 12px;
    color: #888780;
  }

  @media (prefers-color-scheme: dark) {
    body { background: #1c1c1a; }
    h1 { color: #d3d1c7; }
    footer { color: #5f5e5a; }
    .card { background: #2c2c2a; box-shadow: 0 2px 12px rgba(0,0,0,0.3); }

    .c-purple rect, .c-purple circle, .c-purple ellipse { fill: #3C3489; stroke: #AFA9EC; }
    .c-purple .th { fill: #CECBF6; }
    .c-purple .ts { fill: #AFA9EC; }

    .c-teal rect, .c-teal circle, .c-teal ellipse { fill: #085041; stroke: #5DCAA5; }
    .c-teal .th { fill: #9FE1CB; }
    .c-teal .ts { fill: #5DCAA5; }

    .c-amber rect, .c-amber circle, .c-amber ellipse { fill: #633806; stroke: #EF9F27; }
    .c-amber .th { fill: #FAC775; }
    .c-amber .ts { fill: #EF9F27; }

    .c-coral rect, .c-coral circle, .c-coral ellipse { fill: #712B13; stroke: #F0997B; }
    .c-coral .th { fill: #F5C4B3; }
    .c-coral .ts { fill: #F0997B; }

    .c-blue rect, .c-blue circle, .c-blue ellipse { fill: #0C447C; stroke: #85B7EB; }
    .c-blue .th { fill: #B5D4F4; }
    .c-blue .ts { fill: #85B7EB; }

    .arr { stroke: #5f5e5a; }
    .leader { stroke: #5f5e5a; }
    .th { fill: #d3d1c7; }
    .ts { fill: #888780; }
  }
</style>
</head>
<body>

<div id="tooltip"></div>

<div class="card">
  <h1>AI 能力全景工程图</h1>
  <svg width="100%" viewBox="0 0 680 580" role="img">
    <title>AI 能力全景工程图</title>
    <desc>以工程结构图形式展示 AI 当前能力的各大模块</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- CORE -->
    <g class="node c-purple" data-tip="底层大语言模型 / 多模态模型，驱动所有上层能力">
      <rect x="255" y="20" width="170" height="52" rx="10" stroke-width="0.5"/>
      <text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">AI 核心引擎</text>
      <text class="ts" x="340" y="60" text-anchor="middle" dominant-baseline="central">大语言模型 / 多模态模型</text>
    </g>

    <!-- COL 1: 语言 -->
    <g class="node c-teal" data-tip="写作、翻译、润色、问答、代码生成">
      <rect x="30" y="130" width="160" height="48" rx="8" stroke-width="0.5"/>
      <text class="th" x="110" y="150" text-anchor="middle" dominant-baseline="central">语言与文字</text>
      <text class="ts" x="110" y="167" text-anchor="middle" dominant-baseline="central">Language &amp; Text</text>
    </g>
    <g class="node c-teal" data-tip="写文章、邮件、报告；多语言翻译；语法润色">
      <rect x="30" y="198" width="160" height="36" rx="6" stroke-width="0.5"/>
      <text class="ts" x="110" y="216" text-anchor="middle" dominant-baseline="central">写作 · 翻译 · 润色</text>
    </g>
    <g class="node c-teal" data-tip="生成代码、定位 Bug、解释逻辑、重构代码">
      <rect x="30" y="244" width="160" height="36" rx="6" stroke-width="0.5"/>
      <text class="ts" x="110" y="262" text-anchor="middle" dominant-baseline="central">写代码 · Debug</text>
    </g>
    <g class="node c-teal" data-tip="智能客服、教育辅导、知识问答">
      <rect x="30" y="290" width="160" height="36" rx="6" stroke-width="0.5"/>
      <text class="ts" x="110" y="308" text-anchor="middle" dominant-baseline="central">问答 · 客服 · 教育</text>
    </g>

    <!-- COL 2: 图像 -->
    <g class="node c-amber" data-tip="图像生成、视频生成、图像理解与分析">
      <rect x="210" y="130" width="160" height="48" rx="8" stroke-width="0.5"/>
      <text class="th" x="290" y="150" text-anchor="middle" dominant-baseline="central">图像与视频</text>
      <text class="ts" x="290" y="167" text-anchor="middle" dominant-baseline="central">Image &amp; Video</text>
    </g>
    <g class="node c-amber" data-tip="Midjourney、DALL-E、Stable Diffusion 等工具">
      <rect x="210" y="198" width="160" height="36" rx="6" stroke-width="0.5"/>
      <text class="ts" x="290" y="216" text-anchor="middle" dominant-baseline="central">文生图 · 图像编辑</text>
    </g>
    <g class="node c-amber" data-tip="Sora、Runway 等，已可生成逼真短视频">
      <rect x="210" y="244" width="160" height="36" rx="6" stroke-width="0.5"/>
      <text class="ts" x="290" y="262" text-anchor="middle" dominant-baseline="central">视频生成（Seedance 等）</text>
    </g>
    <g class="node c-amber" data-tip="图像分类、目标检测、OCR、场景理解">
      <rect x="210" y="290" width="160" height="36" rx="6" stroke-width="0.5"/>
      <text class="ts" x="290" y="308" text-anchor="middle" dominant-baseline="central">图像识别 · 分析</text>
    </g>

    <!-- COL 3: 语音 -->
    <g class="node c-coral" data-tip="语音识别、语音合成、实时翻译、声音克隆">
      <rect x="390" y="130" width="130" height="48" rx="8" stroke-width="0.5"/>
      <text class="th" x="455" y="150" text-anchor="middle" dominant-baseline="central">语音</text>
      <text class="ts" x="455" y="167" text-anchor="middle" dominant-baseline="central">Speech &amp; Audio</text>
    </g>
    <g class="node c-coral" data-tip="Whisper 等 ASR；文字转语音 TTS">
      <rect x="390" y="198" width="130" height="36" rx="6" stroke-width="0.5"/>
      <text class="ts" x="455" y="216" text-anchor="middle" dominant-baseline="central">语音识别 / TTS</text>
    </g>
    <g class="node c-coral" data-tip="多语言实时语音翻译，支持会议场景">
      <rect x="390" y="244" width="130" height="36" rx="6" stroke-width="0.5"/>
      <text class="ts" x="455" y="262" text-anchor="middle" dominant-baseline="central">实时翻译</text>
    </g>
    <g class="node c-coral" data-tip="仅需几秒样本即可克隆特定人声">
      <rect x="390" y="290" width="130" height="36" rx="6" stroke-width="0.5"/>
      <text class="ts" x="455" y="308" text-anchor="middle" dominant-baseline="central">声音克隆</text>
    </g>

    <!-- COL 4: 专业 -->
    <g class="node c-blue" data-tip="医疗、法律、科研、金融等垂直行业应用">
      <rect x="540" y="130" width="120" height="48" rx="8" stroke-width="0.5"/>
      <text class="th" x="600" y="150" text-anchor="middle" dominant-baseline="central">专业领域</text>
      <text class="ts" x="600" y="167" text-anchor="middle" dominant-baseline="central">Verticals</text>
    </g>
    <g class="node c-blue" data-tip="辅助诊断、影像分析；合同审核、案例检索">
      <rect x="540" y="198" width="120" height="36" rx="6" stroke-width="0.5"/>
      <text class="ts" x="600" y="216" text-anchor="middle" dominant-baseline="central">医疗 · 法律</text>
    </g>
    <g class="node c-blue" data-tip="AlphaFold 蛋白质结构预测；文献综述自动化">
      <rect x="540" y="244" width="120" height="36" rx="6" stroke-width="0.5"/>
      <text class="ts" x="600" y="262" text-anchor="middle" dominant-baseline="central">科研辅助</text>
    </g>
    <g class="node c-blue" data-tip="风险分析、量化交易策略、财报解读">
      <rect x="540" y="290" width="120" height="36" rx="6" stroke-width="0.5"/>
      <text class="ts" x="600" y="308" text-anchor="middle" dominant-baseline="central">金融 · 量化</text>
    </g>

    <!-- AGENT -->
    <g class="node c-purple" data-tip="多能力协同，自主完成复杂多步骤任务">
      <rect x="150" y="380" width="380" height="52" rx="10" stroke-width="1"/>
      <text class="th" x="340" y="402" text-anchor="middle" dominant-baseline="central">Agent · 自主行动</text>
      <text class="ts" x="340" y="420" text-anchor="middle" dominant-baseline="central">操作电脑 · 发邮件 · 写代码 · 自动化任务</text>
    </g>
    <g class="node c-purple" data-tip="Claude Code 等工具，可读写项目文件并执行命令">
      <rect x="150" y="452" width="110" height="34" rx="6" stroke-width="0.5"/>
      <text class="ts" x="205" y="469" text-anchor="middle" dominant-baseline="central">代码 Agent</text>
    </g>
    <g class="node c-purple" data-tip="自动浏览网页、填写表单、完成网络操作">
      <rect x="275" y="452" width="110" height="34" rx="6" stroke-width="0.5"/>
      <text class="ts" x="330" y="469" text-anchor="middle" dominant-baseline="central">浏览器 Agent</text>
    </g>
    <g class="node c-purple" data-tip="管理本地文件、批量处理任务、日程自动化">
      <rect x="400" y="452" width="130" height="34" rx="6" stroke-width="0.5"/>
      <text class="ts" x="465" y="469" text-anchor="middle" dominant-baseline="central">文件 / 任务自动化</text>
    </g>

    <!-- 连接线：核心 → 各列 -->
    <path d="M290 72 L110 130" class="arr" marker-end="url(#arrow)"/>
    <path d="M320 72 L290 130" class="arr" marker-end="url(#arrow)"/>
    <path d="M360 72 L455 130" class="arr" marker-end="url(#arrow)"/>
    <path d="M390 72 L600 130" class="arr" marker-end="url(#arrow)"/>

    <!-- 各列标题 → subs -->
    <line x1="110" y1="178" x2="110" y2="198" class="arr" marker-end="url(#arrow)"/>
    <line x1="110" y1="234" x2="110" y2="244" class="arr" marker-end="url(#arrow)"/>
    <line x1="110" y1="280" x2="110" y2="290" class="arr" marker-end="url(#arrow)"/>

    <line x1="290" y1="178" x2="290" y2="198" class="arr" marker-end="url(#arrow)"/>
    <line x1="290" y1="234" x2="290" y2="244" class="arr" marker-end="url(#arrow)"/>
    <line x1="290" y1="280" x2="290" y2="290" class="arr" marker-end="url(#arrow)"/>

    <line x1="455" y1="178" x2="455" y2="198" class="arr" marker-end="url(#arrow)"/>
    <line x1="455" y1="234" x2="455" y2="244" class="arr" marker-end="url(#arrow)"/>
    <line x1="455" y1="280" x2="455" y2="290" class="arr" marker-end="url(#arrow)"/>

    <line x1="600" y1="178" x2="600" y2="198" class="arr" marker-end="url(#arrow)"/>
    <line x1="600" y1="234" x2="600" y2="244" class="arr" marker-end="url(#arrow)"/>
    <line x1="600" y1="280" x2="600" y2="290" class="arr" marker-end="url(#arrow)"/>

    <!-- 各列 → Agent -->
    <path d="M110 326 L220 380" class="leader" marker-end="url(#arrow)"/>
    <path d="M290 326 L300 380" class="leader" marker-end="url(#arrow)"/>
    <path d="M455 326 L390 380" class="leader" marker-end="url(#arrow)"/>
    <path d="M600 326 L490 380" class="leader" marker-end="url(#arrow)"/>

    <!-- Agent → subs -->
    <line x1="205" y1="432" x2="205" y2="452" class="arr" marker-end="url(#arrow)"/>
    <line x1="330" y1="432" x2="330" y2="452" class="arr" marker-end="url(#arrow)"/>
    <line x1="465" y1="432" x2="465" y2="452" class="arr" marker-end="url(#arrow)"/>

    <!-- 图例 -->
    <text class="ts" x="340" y="530" text-anchor="middle">鼠标悬停查看说明</text>
    <line x1="190" y1="548" x2="240" y2="548" class="arr" marker-end="url(#arrow)"/>
    <text class="ts" x="248" y="548" dominant-baseline="central">实线：直接驱动</text>
    <line x1="380" y1="548" x2="430" y2="548" class="leader" marker-end="url(#arrow)"/>
    <text class="ts" x="438" y="548" dominant-baseline="central">虚线：能力汇聚</text>
  </svg>
</div>

<footer>AI 能力全景 · 2025 · 点击或悬停节点查看详情</footer>

<script>
  const tooltip = document.getElementById('tooltip');
  document.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mouseenter', e => {
      tooltip.textContent = el.dataset.tip;
      tooltip.style.opacity = '1';
    });
    el.addEventListener('mousemove', e => {
      tooltip.style.left = (e.clientX + 12) + 'px';
      tooltip.style.top  = (e.clientY - 28) + 'px';
    });
    el.addEventListener('mouseleave', () => {
      tooltip.style.opacity = '0';
    });
  });
</script>
</body>
</html>
